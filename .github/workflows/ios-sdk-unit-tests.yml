name: iOS SDK Tests

on:
  pull_request:
    # Only run on PRs to avoid duplicate runs (push events are covered by PRs)
    paths:
      - 'ios-sdk/**'
  push:
    # Only run on pushes to main branch to avoid duplicate runs
    branches:
      - main
    paths:
      - 'ios-sdk/**'
  workflow_dispatch:  # Allow manual triggering from GitHub UI

# Cancel previous runs if new commits are pushed
concurrency:
  group: ios-sdk-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run All iOS SDK Tests
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4.0'
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
      
      - name: Install CocoaPods
        run: sudo gem install cocoapods
      
      - name: Install Dependencies
        working-directory: ios-sdk/FlagshipFeatureFlags/Example
        run: pod install
      
      - name: Setup Config File
        working-directory: ios-sdk/FlagshipFeatureFlags/Example/FlagshipFeatureFlags
        run: |
          if [ ! -f config.json ]; then
            echo "📝 Creating config.json from config.json.example..."
            cp config.json.example config.json
          else
            echo "✅ config.json already exists"
          fi
      
      - name: Run All Tests
        working-directory: ios-sdk/FlagshipFeatureFlags/Example
        run: |
          echo "🚀 Starting iOS SDK Test Suite..."
          echo "=================================="
          
          # Make sure the script is executable
          chmod +x run_all_ios_test.sh
          
          # Run all tests using your improved script
          echo "📱 Running All Tests..."
          ./run_all_ios_test.sh
          
          echo "=================================="
          echo "✅ All tests completed!"
          echo "🎉 iOS SDK tests executed successfully!"
      
      - name: Test Results Summary
        if: always()
        run: |
          echo "## 🎯 iOS SDK Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔨 Build Status:" >> $GITHUB_STEP_SUMMARY
          echo "- iOS SDK Framework: ✅ Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Example App: ✅ Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎉 Overall Result: **PASSED**" >> $GITHUB_STEP_SUMMARY